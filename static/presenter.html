<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>강의 반응 — 강사 화면</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #080812;
      color: #e2e8f0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── Shared form views ── */
    .view-form {
      flex: 1;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-y: auto;
    }

    .form-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      padding: 40px 36px;
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      backdrop-filter: blur(12px);
    }

    .form-card h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #a78bfa;
      text-align: center;
    }

    .form-card .subtitle {
      font-size: 0.85rem;
      color: #64748b;
      text-align: center;
      margin-top: -8px;
    }

    .user-info-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(167,139,250,0.08);
      border: 1px solid rgba(167,139,250,0.2);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 0.88rem;
    }

    .user-info-bar span {
      color: #c4b5fd;
      font-weight: 600;
    }

    .logout-btn-sm {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 0.8rem;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      transition: background 0.15s, color 0.15s;
    }
    .logout-btn-sm:hover { color: #f87171; background: rgba(248,113,113,0.12); }

    .form-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-field label {
      font-size: 0.8rem;
      color: #94a3b8;
    }

    .form-field input {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 2px solid rgba(255,255,255,0.09);
      border-radius: 12px;
      padding: 12px 16px;
      color: #e2e8f0;
      font-size: 1rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }

    .form-field input:focus { border-color: #a78bfa; }

    .form-btn {
      width: 100%;
      background: rgba(167,139,250,0.15);
      border: 2px solid rgba(167,139,250,0.4);
      border-radius: 12px;
      padding: 13px;
      color: #a78bfa;
      font-size: 1rem;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s;
      margin-top: 4px;
    }

    .form-btn:hover    { background: rgba(167,139,250,0.28); }
    .form-btn:disabled { opacity: 0.4; cursor: default; }

    .form-error {
      font-size: 0.85rem;
      color: #f87171;
      text-align: center;
      display: none;
    }

    .form-link {
      font-size: 0.82rem;
      color: #475569;
      text-align: center;
      cursor: pointer;
      transition: color 0.15s;
      background: none;
      border: none;
      font-family: inherit;
      padding: 4px;
    }

    .form-link:hover { color: #94a3b8; }

    /* login view — room code display */
    .room-code-display {
      background: rgba(167,139,250,0.08);
      border: 1px solid rgba(167,139,250,0.2);
      border-radius: 10px;
      padding: 10px 16px;
      text-align: center;
      font-size: 0.82rem;
      color: #64748b;
    }

    .room-code-display span {
      font-family: monospace;
      font-size: 1.1rem;
      font-weight: 700;
      color: #e2e8f0;
      letter-spacing: 0.1em;
    }

    /* ── Room list ── */
    .room-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      max-height: 280px;
      overflow-y: auto;
    }

    .room-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      cursor: pointer;
      color: inherit;
      font-family: inherit;
      font-size: 1rem;
      text-align: left;
      width: 100%;
      transition: background 0.15s, border-color 0.15s;
    }

    .room-item:hover {
      background: rgba(167,139,250,0.1);
      border-color: rgba(167,139,250,0.3);
    }

    .room-item-title { color: #e2e8f0; font-weight: 500; }

    .room-item-code {
      font-family: monospace;
      font-size: 0.85rem;
      color: #a78bfa;
      background: rgba(167,139,250,0.12);
      padding: 3px 8px;
      border-radius: 6px;
      letter-spacing: 0.08em;
    }

    .list-section-label {
      font-size: 0.78rem;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: -4px;
    }

    #no-rooms-msg {
      font-size: 0.85rem;
      color: #475569;
      text-align: center;
      padding: 12px 0;
    }

    /* ── Presenter view ── */
    #view-presenter {
      display: none;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
    }

    /* ── Header ── */
    #header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 32px;
      background: rgba(255,255,255,0.04);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      flex-shrink: 0;
    }

    #exit-btn, #delete-room-btn {
      background: none;
      border: none;
      font-size: 0.85rem;
      font-family: inherit;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 8px;
      transition: color 0.15s, background 0.15s;
    }

    #exit-btn { color: #475569; }
    #exit-btn:hover {
      color: #94a3b8;
      background: rgba(255,255,255,0.06);
    }

    #delete-room-btn { color: #475569; }
    #delete-room-btn:hover {
      color: #f87171;
      background: rgba(248,113,113,0.1);
    }

    #title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #a78bfa;
      letter-spacing: -0.01em;
    }

    #room-badge {
      font-size: 0.85rem;
      color: #64748b;
    }

    #room-badge span {
      font-weight: 700;
      color: #e2e8f0;
      font-family: monospace;
      font-size: 1.1rem;
      letter-spacing: 0.15em;
    }

    #count-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(167,139,250,0.12);
      border: 1px solid rgba(167,139,250,0.35);
      border-radius: 999px;
      padding: 7px 18px;
      font-size: 0.95rem;
      color: #c4b5fd;
    }

    #count-badge .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 6px #4ade80;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    /* ── Main ── */
    #main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    #join-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      padding: 36px 48px;
      backdrop-filter: blur(12px);
      z-index: 10;
      text-align: center;
    }

    #join-card h2 {
      font-size: 0.95rem;
      font-weight: 400;
      color: #94a3b8;
    }

    #qrcode {
      background: white;
      padding: 14px;
      border-radius: 16px;
      line-height: 0;
    }

    #join-url {
      font-size: 1.05rem;
      font-weight: 600;
      color: #a78bfa;
      letter-spacing: 0.03em;
    }

    /* ── Speech bubbles ── */
    #bubble-layer {
      position: fixed;
      bottom: 32px;
      left: 32px;
      width: 340px;
      max-height: 60vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 10px;
      pointer-events: none;
      z-index: 300;
      overflow-y: auto;
    }

    .bubble {
      pointer-events: auto;
      background: rgba(20, 16, 40, 0.92);
      border: 1px solid rgba(167,139,250,0.45);
      border-radius: 18px 18px 18px 4px;
      padding: 10px 10px 10px 16px;
      color: #e2e8f0;
      font-size: 1rem;
      line-height: 1.45;
      word-break: break-word;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 24px rgba(0,0,0,0.5);
      animation: bubbleIn 0.3s ease forwards;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .bubble-text { flex: 1; }

    .bubble-close {
      flex-shrink: 0;
      background: transparent;
      border: none;
      color: #475569;
      font-size: 0.85rem;
      cursor: pointer;
      padding: 2px 4px;
      line-height: 1;
      border-radius: 6px;
      transition: color 0.15s, background 0.15s;
    }

    .bubble-close:hover {
      color: #e2e8f0;
      background: rgba(255,255,255,0.1);
    }

    @keyframes bubbleIn {
      from { opacity: 0; transform: translateY(12px) scale(0.95); }
      to   { opacity: 1; transform: translateY(0)    scale(1);    }
    }

    /* ── Status bar ── */
    #statusbar {
      padding: 8px 20px;
      font-size: 0.75rem;
      color: #334155;
      text-align: center;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

<!-- ── View 0: 강사 로그인 ── -->
<div id="view-auth-login" class="view-form">
  <div class="form-card">
    <h1>🎓 강사 로그인</h1>
    <p class="subtitle">강의 생성을 위해 교수자 계정으로 로그인하세요</p>

    <div class="form-field">
      <label for="auth-login-username">아이디</label>
      <input id="auth-login-username" type="text" placeholder="아이디 입력" autocomplete="username" />
    </div>

    <div class="form-field">
      <label for="auth-login-password">비밀번호</label>
      <input id="auth-login-password" type="password" placeholder="비밀번호 입력" autocomplete="current-password" />
    </div>

    <button id="auth-login-btn" class="form-btn">로그인</button>
    <p id="auth-login-error" class="form-error"></p>

    <button class="form-link" id="goto-register-btn">교수자 회원가입 (Master Key 필요) →</button>
  </div>
</div>

<!-- ── View 1: 강사 회원가입 (Master Key) ── -->
<div id="view-auth-register" class="view-form">
  <div class="form-card">
    <h1>🔑 교수자 회원가입</h1>
    <p class="subtitle">교수자 전용 Master Key와 계정 정보를 입력하세요</p>

    <div class="form-field">
      <label for="register-master-key">Master Key (발급받은 마스터 키)</label>
      <input id="register-master-key" type="password" placeholder="마스터 키 입력" autocomplete="off" />
    </div>

    <div class="form-field">
      <label for="register-username">아이디 (3자 이상)</label>
      <input id="register-username" type="text" placeholder="아이디 입력" autocomplete="username" />
    </div>

    <div class="form-field">
      <label for="register-password">비밀번호 (4자 이상)</label>
      <input id="register-password" type="password" placeholder="비밀번호 입력" autocomplete="new-password" />
    </div>

    <button id="register-btn" class="form-btn">회원가입 완료</button>
    <p id="register-error" class="form-error"></p>

    <button class="form-link" id="goto-login-btn">← 로그인 화면으로 돌아가기</button>
  </div>
</div>

<!-- ── View 2: 내 강의 방 목록 ── -->
<div id="view-list" class="view-form">
  <div class="form-card" style="max-width: 480px;">
    <h1>🎓 내 강의 목록</h1>

    <div class="user-info-bar">
      <span>👤 <strong id="current-user-display">강사</strong>님 환영합니다</span>
      <button id="logout-btn" class="logout-btn-sm">로그아웃</button>
    </div>

    <button id="goto-create-btn" class="form-btn">+ 새 방 개설</button>

    <p class="list-section-label">개설된 내 수업 목록</p>
    <div id="room-list" class="room-list"></div>
    <p id="no-rooms-msg" style="display:none">개설된 방이 없습니다</p>
  </div>
</div>

<!-- ── View 3: 새 수업 개설 ── -->
<div id="view-create" class="view-form">
  <div class="form-card">
    <h1>🎓 새 수업 시작</h1>
    <p class="subtitle">방 제목과 강의자 접근 비밀번호를 설정하세요</p>

    <div class="form-field">
      <label for="create-title">수업/강의 제목</label>
      <input id="create-title" type="text" maxlength="50"
             placeholder="예: 인공지능 개론" autocomplete="off" />
    </div>

    <div class="form-field">
      <label for="create-password">방 비밀번호 (오버레이 및 재입장용)</label>
      <input id="create-password" type="password"
             placeholder="비밀번호 설정" autocomplete="new-password" />
    </div>

    <button id="create-btn" class="form-btn">방 개설하기</button>
    <p id="create-error" class="form-error"></p>
    <button class="form-link" id="back-to-list-from-create">← 내 강의 목록으로</button>
  </div>
</div>

<!-- ── View 4: 방 비밀번호 입력 (게스트/오버레이 입장용) ── -->
<div id="view-login" class="view-form">
  <div class="form-card">
    <h1 id="login-room-title">🔒 강의 입장</h1>
    <div class="room-code-display">방 코드: <span id="login-room-code">…</span></div>
    <p class="subtitle">강의자 방 비밀번호를 입력하세요</p>

    <div class="form-field">
      <label for="login-password">비밀번호</label>
      <input id="login-password" type="password"
             placeholder="비밀번호" autocomplete="current-password" />
    </div>

    <button id="login-btn" class="form-btn">입장</button>
    <p id="login-error" class="form-error"></p>
    <button class="form-link" id="back-to-list-from-login">← 방 목록으로</button>
  </div>
</div>

<!-- ── View 5: 라이브 강사 화면 ── -->
<div id="view-presenter">
  <div id="header">
    <div style="display:flex;gap:6px;">
      <button id="exit-btn">← 목록</button>
      <button id="delete-room-btn">🗑 방 삭제</button>
    </div>
    <div id="title">🎓 강의 이모지 반응</div>
    <div id="room-badge">방 코드: <span id="room-code">…</span></div>
    <div id="count-badge">
      <span class="dot"></span>
      학생 <span id="count">0</span>명 접속 중
    </div>
  </div>

  <div id="main">
    <div id="join-card">
      <h2>학생들에게 아래 QR코드 또는 주소를 공유하세요</h2>
      <div id="qrcode"></div>
      <div id="join-url">연결 중…</div>
    </div>
  </div>

  <div id="bubble-layer"></div>
  <div id="statusbar">서버 연결 중…</div>
</div>

<script>
  // ── 상태 및 토큰 ────────────────────────────────────────────────────────────
  const params = new URLSearchParams(location.search);
  let roomId   = params.get('room') ? params.get('room').toUpperCase() : null;
  let ws;

  function getAuthToken() { return localStorage.getItem('presenter_auth_token'); }
  function setAuthToken(token) { localStorage.setItem('presenter_auth_token', token); }
  function removeAuthToken() { localStorage.removeItem('presenter_auth_token'); }

  // ── 뷰 전환 ────────────────────────────────────────────────────────────────
  function showView(name) {
    document.getElementById('view-auth-login').style.display    = name === 'auth-login'    ? 'flex' : 'none';
    document.getElementById('view-auth-register').style.display = name === 'auth-register' ? 'flex' : 'none';
    document.getElementById('view-list').style.display          = name === 'list'          ? 'flex' : 'none';
    document.getElementById('view-create').style.display        = name === 'create'        ? 'flex' : 'none';
    document.getElementById('view-login').style.display         = name === 'login'         ? 'flex' : 'none';
    document.getElementById('view-presenter').style.display     = name === 'presenter'     ? 'flex' : 'none';

    if (name === 'auth-login')    document.getElementById('auth-login-username').focus();
    if (name === 'auth-register') document.getElementById('register-master-key').focus();
    if (name === 'create')       document.getElementById('create-title').focus();
    if (name === 'login')        document.getElementById('login-password').focus();
  }

  // ── 강사 계정 로그인 & 회원가입 ──────────────────────────────────────────────
  document.getElementById('goto-register-btn').addEventListener('click', () => showView('auth-register'));
  document.getElementById('goto-login-btn').addEventListener('click', () => showView('auth-login'));

  document.getElementById('auth-login-btn').addEventListener('click', handleAuthLogin);
  document.getElementById('auth-login-password').addEventListener('keydown', e => { if (e.key === 'Enter') handleAuthLogin(); });

  async function handleAuthLogin() {
    const username = document.getElementById('auth-login-username').value.trim();
    const password = document.getElementById('auth-login-password').value;
    const errEl    = document.getElementById('auth-login-error');
    errEl.style.display = 'none';

    if (!username || !password) {
      errEl.textContent = '아이디와 비밀번호를 모두 입력하세요.';
      errEl.style.display = 'block';
      return;
    }

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || '로그인 실패');

      setAuthToken(data.token);
      document.getElementById('current-user-display').textContent = data.username;
      showView('list');
      loadRoomList();
    } catch (e) {
      errEl.textContent = e.message;
      errEl.style.display = 'block';
    }
  }

  document.getElementById('register-btn').addEventListener('click', handleRegister);
  document.getElementById('register-password').addEventListener('keydown', e => { if (e.key === 'Enter') handleRegister(); });

  async function handleRegister() {
    const master_key = document.getElementById('register-master-key').value;
    const username   = document.getElementById('register-username').value.trim();
    const password   = document.getElementById('register-password').value;
    const errEl      = document.getElementById('register-error');
    errEl.style.display = 'none';

    if (!master_key) {
      errEl.textContent = 'Master Key를 입력하세요.';
      errEl.style.display = 'block';
      return;
    }
    if (!username || !password) {
      errEl.textContent = '아이디와 비밀번호를 모두 입력하세요.';
      errEl.style.display = 'block';
      return;
    }

    try {
      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ master_key, username, password })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || '회원가입 실패');

      setAuthToken(data.token);
      document.getElementById('current-user-display').textContent = data.username;
      alert('교수자 회원가입이 완료되었습니다!');
      showView('list');
      loadRoomList();
    } catch (e) {
      errEl.textContent = e.message;
      errEl.style.display = 'block';
    }
  }

  document.getElementById('logout-btn').addEventListener('click', async () => {
    const token = getAuthToken();
    if (token) {
      fetch('/api/auth/logout', { method: 'POST', headers: { 'Authorization': `Bearer ${token}` } }).catch(() => {});
    }
    removeAuthToken();
    showView('auth-login');
  });

  // ── 방 목록 ────────────────────────────────────────────────────────────────
  document.getElementById('goto-create-btn').addEventListener('click', () => showView('create'));

  async function loadRoomList() {
    const token = getAuthToken();
    if (!token) {
      showView('auth-login');
      return;
    }

    const listEl    = document.getElementById('room-list');
    const noRoomsEl = document.getElementById('no-rooms-msg');
    listEl.innerHTML = '';
    try {
      const res  = await fetch('/api/rooms', {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (res.status === 401) {
        removeAuthToken();
        showView('auth-login');
        return;
      }
      const data = await res.json();
      if (!data.length) {
        noRoomsEl.style.display = 'block';
        return;
      }
      noRoomsEl.style.display = 'none';
      data.forEach(room => {
        const btn = document.createElement('button');
        btn.className = 'room-item';

        const titleSpan = document.createElement('span');
        titleSpan.className = 'room-item-title';
        titleSpan.textContent = room.title;

        const codeSpan = document.createElement('span');
        codeSpan.className = 'room-item-code';
        codeSpan.textContent = room.room_id;

        btn.appendChild(titleSpan);
        btn.appendChild(codeSpan);
        btn.addEventListener('click', () => {
          location.href = `?room=${room.room_id}`;
        });
        listEl.appendChild(btn);
      });
    } catch {
      noRoomsEl.textContent = '목록을 불러올 수 없습니다.';
      noRoomsEl.style.display = 'block';
    }
  }

  // ── 방 개설 ────────────────────────────────────────────────────────────────
  document.getElementById('create-btn').addEventListener('click', createRoom);
  document.getElementById('back-to-list-from-create').addEventListener('click', () => {
    showView('list');
    loadRoomList();
  });
  document.getElementById('create-password').addEventListener('keydown', e => {
    if (e.key === 'Enter') createRoom();
  });

  async function createRoom() {
    const title    = document.getElementById('create-title').value.trim();
    const password = document.getElementById('create-password').value;
    const errEl    = document.getElementById('create-error');
    const token    = getAuthToken();
    errEl.style.display = 'none';

    if (!token) {
      showView('auth-login');
      return;
    }
    if (!title) {
      errEl.textContent = '방 제목을 입력하세요.';
      errEl.style.display = 'block';
      document.getElementById('create-title').focus();
      return;
    }
    if (!password) {
      errEl.textContent = '비밀번호를 입력하세요.';
      errEl.style.display = 'block';
      document.getElementById('create-password').focus();
      return;
    }

    const btn = document.getElementById('create-btn');
    btn.disabled = true;

    try {
      const res  = await fetch('/api/room', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify({ title, password }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || '방 개설 실패');

      sessionStorage.setItem(`token_${data.room_id}`, data.token);
      location.href = `?room=${data.room_id}`;
    } catch (e) {
      errEl.textContent = e.message;
      errEl.style.display = 'block';
      btn.disabled = false;
    }
  }

  // ── 비밀번호 입력 (방 직접 접근시) ─────────────────────────────────────────
  document.getElementById('login-btn').addEventListener('click', loginRoom);
  document.getElementById('login-password').addEventListener('keydown', e => {
    if (e.key === 'Enter') loginRoom();
  });
  document.getElementById('back-to-list-from-login').addEventListener('click', () => {
    history.pushState(null, '', location.pathname);
    roomId = null;
    checkAuthAndInit();
  });

  async function loginRoom() {
    const password = document.getElementById('login-password').value;
    const errEl    = document.getElementById('login-error');
    errEl.style.display = 'none';

    if (!password) {
      errEl.textContent = '비밀번호를 입력하세요.';
      errEl.style.display = 'block';
      return;
    }

    const btn = document.getElementById('login-btn');
    btn.disabled = true;

    try {
      const res  = await fetch(`/api/room/${roomId}/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password }),
      });
      const data = await res.json();
      if (res.status === 401) throw new Error('비밀번호가 틀렸습니다.');
      if (res.status === 404) throw new Error('방을 찾을 수 없습니다.');
      if (!res.ok) throw new Error(data.error || '로그인 실패');

      sessionStorage.setItem(`token_${roomId}`, data.token);
      showView('presenter');
      startPresenter(roomId, data.token);
    } catch (e) {
      errEl.textContent = e.message;
      errEl.style.display = 'block';
      btn.disabled = false;
    }
  }

  // ── 강사 화면 ──────────────────────────────────────────────────────────────
  const bubbleLayer = document.getElementById('bubble-layer');
  const status      = document.getElementById('statusbar');
  const countEl     = document.getElementById('count');

  function spawnBubble(text, id) {
    if (bubbleLayer.querySelector(`[data-id="${CSS.escape(id)}"]`)) return;
    const el   = document.createElement('div');
    el.className = 'bubble';
    el.dataset.id = id;

    const span = document.createElement('span');
    span.className = 'bubble-text';
    span.textContent = text;

    const btn = document.createElement('button');
    btn.className = 'bubble-close';
    btn.textContent = '✕';
    btn.addEventListener('click', () => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'delete_bubble', id }));
      }
    });

    el.appendChild(span);
    el.appendChild(btn);
    bubbleLayer.appendChild(el);
  }

  function deleteBubble(id) {
    const el = bubbleLayer.querySelector(`[data-id="${CSS.escape(id)}"]`);
    if (el) el.remove();
  }

  document.getElementById('exit-btn').addEventListener('click', () => {
    if (ws) ws.close();
    sessionStorage.removeItem(`token_${roomId}`);
    roomId = null;
    history.replaceState(null, '', location.pathname);
    checkAuthAndInit();
  });

  document.getElementById('delete-room-btn').addEventListener('click', async () => {
    const title = document.getElementById('title').textContent.replace(/^🎓\s*/, '');
    if (!confirm(`"${title}" 방을 삭제하시겠습니까?\n접속 중인 학생들의 연결이 끊어집니다.`)) return;
    const roomToken = sessionStorage.getItem(`token_${roomId}`);
    const authToken = getAuthToken();
    const headers   = {};
    if (authToken) headers['Authorization'] = `Bearer ${authToken}`;
    else if (roomToken) headers['Authorization'] = `Bearer ${roomToken}`;

    try {
      const res = await fetch(`/api/room/${roomId}`, { method: 'DELETE', headers });
      if (!res.ok) throw new Error();
      if (ws) ws.close();
      sessionStorage.removeItem(`token_${roomId}`);
      roomId = null;
      history.replaceState(null, '', location.pathname);
      checkAuthAndInit();
    } catch {
      alert('방 삭제에 실패했습니다.');
    }
  });

  function connectWS(rId, token) {
    const host  = window.location.host;
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${host}/ws/presenter?room=${rId}&token=${token}`);

    ws.onopen = () => {
      status.textContent = '✅ 서버 연결됨';
    };

    ws.onmessage = ({ data }) => {
      const msg = JSON.parse(data);
      if (msg.type === 'count')         countEl.textContent = msg.count;
      if (msg.type === 'question')      spawnBubble(msg.text, msg.id);
      if (msg.type === 'delete_bubble') deleteBubble(msg.id);
    };

    ws.onclose = (event) => {
      if (event.code === 4001) {
        sessionStorage.removeItem(`token_${rId}`);
        document.getElementById('login-password').value = '';
        showView('login');
        return;
      }
      status.textContent = '⚠️ 연결 끊김 — 재연결 중…';
      setTimeout(() => connectWS(rId, token), 2000);
    };
  }

  async function startPresenter(rId, token) {
    bubbleLayer.innerHTML = '';
    try {
      const res  = await fetch(`/api/room/${rId}`);
      const data = await res.json();
      document.getElementById('title').textContent = `🎓 ${data.title}`;
    } catch {
      document.getElementById('title').textContent = '🎓 강의 이모지 반응';
    }

    document.getElementById('room-code').textContent = rId;

    const host       = window.location.host;
    const studentUrl = `${location.protocol}//${host}/student.html?room=${rId}`;
    document.getElementById('join-url').textContent = studentUrl;

    const qrEl = document.getElementById('qrcode');
    qrEl.innerHTML = '';
    new QRCode(qrEl, {
      text: studentUrl,
      width: 200, height: 200,
      colorDark: '#000000', colorLight: '#ffffff',
    });

    connectWS(rId, token);
  }

  // ── 초기화 및 인증 검사 ─────────────────────────────────────────────────────
  async function checkAuthAndInit() {
    const token = getAuthToken();
    if (token) {
      try {
        const res = await fetch('/api/auth/me', { headers: { 'Authorization': `Bearer ${token}` } });
        if (res.ok) {
          const user = await res.json();
          document.getElementById('current-user-display').textContent = user.username;
          if (!roomId) {
            showView('list');
            loadRoomList();
            return;
          }
        } else {
          removeAuthToken();
        }
      } catch {
        /* 네트워크 오류 시 토큰 유효성 불확실 */
      }
    }

    if (!roomId) {
      showView('auth-login');
      return;
    }

    const storedRoomToken = sessionStorage.getItem(`token_${roomId}`);
    if (storedRoomToken) {
      showView('presenter');
      startPresenter(roomId, storedRoomToken);
      return;
    }

    // 방 정보 조회 후 비밀번호 로그인 화면 표시
    try {
      const res = await fetch(`/api/room/${roomId}`);
      if (!res.ok) {
        alert(`방 코드 '${roomId}'를 찾을 수 없습니다.`);
        history.replaceState(null, '', location.pathname);
        showView('auth-login');
        return;
      }
      const data = await res.json();
      document.getElementById('login-room-title').textContent = `🔒 ${data.title}`;
    } catch {
      /* ignore */
    }

    document.getElementById('login-room-code').textContent = roomId;
    showView('login');
  }

  checkAuthAndInit();
</script>
</body>
</html>
